services:

  postgres:
    image: postgres:15
    container_name: fraud_postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped


  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow

    container_name: fraud_mlflow

    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}

    ports:
      - "5001:5001"

    volumes:
      - mlflow_data:/mlruns

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/')"
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped


  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api

    container_name: fraud_api

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      MODEL_PATH: /app/mlflow/best_model.pkl
      MODEL_INFO_PATH: /app/mlflow/model_info.json

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}

    volumes:
      - ./mlflow:/app/mlflow

    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped


  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard

    container_name: fraud_dashboard

    ports:
      - "8501:8501"

    env_file:
      - .env

    environment:
      API_URL_DOCKER: ${API_URL_DOCKER}

      POSTGRES_HOST_DOCKER: ${POSTGRES_HOST_DOCKER}
      POSTGRES_PORT_DOCKER: ${POSTGRES_PORT_DOCKER}
      POSTGRES_DB_DOCKER: ${POSTGRES_DB_DOCKER}
      POSTGRES_USER_DOCKER: ${POSTGRES_USER_DOCKER}
      POSTGRES_PASSWORD_DOCKER: ${POSTGRES_PASSWORD_DOCKER}

    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped


volumes:
  postgres_data:
  mlflow_data: